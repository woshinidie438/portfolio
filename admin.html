<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 — PORTFOLIO</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a; --fg: #f0ece4; --accent: #e8572a; --muted: #555;
  --card: #141414; --border: rgba(240,236,228,0.1);
  --sans: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --serif: 'Songti SC', 'STSongti', 'SimSun', Georgia, serif;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); min-height: 100vh; }

/* Login */
.login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
}
.login-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px; width: 100%; max-width: 360px; text-align: center;
}
.login-box h1 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 8px; }
.login-box p { font-size: 0.8rem; color: var(--muted); margin-bottom: 24px; }
.login-box input {
  width: 100%; padding: 12px 16px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--bg); color: var(--fg);
  font-size: 0.9rem; outline: none; margin-bottom: 16px;
}
.login-box input:focus { border-color: var(--accent); }
.login-box button {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  background: var(--accent); color: #fff; font-size: 0.9rem;
  font-weight: 600; cursor: pointer; transition: opacity 0.2s;
}
.login-box button:hover { opacity: 0.85; }
.login-error { color: #f44; font-size: 0.8rem; margin-bottom: 12px; display: none; }

/* Admin Layout */
.admin-app { display: none; min-height: 100vh; }
.admin-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,0.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
}
.admin-header h1 { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; }
.admin-header h1 em { font-style: italic; color: var(--accent); }
.admin-actions { display: flex; gap: 10px; }
.btn {
  padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--fg); font-size: 0.8rem; cursor: pointer;
  transition: all 0.2s; font-family: var(--sans);
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { opacity: 0.85; color: #fff; }
.btn-danger { border-color: #f44; color: #f44; }
.btn-danger:hover { background: #f44; color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 0.7rem; }

/* Content */
.admin-body { padding: 20px; max-width: 1000px; margin: 0 auto; }
.stats-bar {
  display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
}
.stat-card {
  flex: 1; min-width: 120px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px;
}
.stat-card .num { font-family: var(--serif); font-size: 1.8rem; font-weight: 900; color: var(--accent); }
.stat-card .label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }

/* Filter tabs */
.filter-tabs {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.filter-tab {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--muted); font-size: 0.75rem;
  cursor: pointer; transition: all 0.2s; font-family: var(--sans);
}
.filter-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(232,87,42,0.1); }

/* Works List */
.works-list { display: flex; flex-direction: column; gap: 10px; }
.work-item {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; display: flex; gap: 14px; align-items: center;
  transition: border-color 0.2s;
}
.work-item:hover { border-color: rgba(240,236,228,0.2); }
.work-thumb {
  width: 100px; height: 56px; border-radius: 4px;
  object-fit: cover; background: var(--bg); flex-shrink: 0;
}
.work-info { flex: 1; min-width: 0; }
.work-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work-meta { font-size: 0.7rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.work-meta .tag {
  padding: 2px 8px; border-radius: 3px; font-size: 0.6rem;
  background: rgba(232,87,42,0.15); color: var(--accent);
}
.work-meta .tag.featured { background: rgba(42,240,232,0.15); color: #2af0e8; }
.work-controls { display: flex; gap: 6px; flex-shrink: 0; }

/* Modal / Form */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-panel {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; width: 100%; max-width: 560px;
  max-height: 90vh; overflow-y: auto; padding: 28px;
}
.modal-panel h2 { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.75rem; color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--bg); color: var(--fg);
  font-size: 0.85rem; outline: none; font-family: var(--sans);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 60px; }
.form-group select { appearance: none; cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-check {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.form-check input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;
}
.form-hint { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
.bilibili-preview {
  margin-top: 8px; padding: 10px; background: var(--bg);
  border-radius: 6px; font-size: 0.75rem; color: var(--muted); display: none;
}
.bilibili-preview.show { display: block; }

/* Toast */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--accent); color: #fff; padding: 12px 24px;
  border-radius: 8px; font-size: 0.85rem; z-index: 999;
  transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--muted);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
.empty-state p { font-size: 0.9rem; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--muted); font-size: 0.85rem; }

/* Responsive */
@media (max-width: 600px) {
  .form-row { grid-template-columns: 1fr; }
  .work-thumb { width: 72px; height: 40px; }
  .stats-bar { gap: 8px; }
  .stat-card { padding: 12px; }
  .stat-card .num { font-size: 1.4rem; }
}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>PORTFOLIO</h1>
    <p>后台管理系统</p>
    <div class="login-error" id="loginError">密码错误，请重试</div>
    <input type="password" id="passwordInput" placeholder="请输入管理密码" autofocus>
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- Admin App -->
<div class="admin-app" id="adminApp">
  <header class="admin-header">
    <h1><em>Portfolio</em> 管理</h1>
    <div class="admin-actions">
      <button class="btn btn-primary" onclick="openAddModal()">+ 添加作品</button>
      <button class="btn" onclick="doLogout()">退出</button>
    </div>
  </header>

  <div class="admin-body">
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">全部作品</div></div>
      <div class="stat-card"><div class="num" id="statVideo">0</div><div class="label">影像</div></div>
      <div class="stat-card"><div class="num" id="statGraphic">0</div><div class="label">平面</div></div>
      <div class="stat-card"><div class="num" id="stat3D">0</div><div class="label">三维</div></div>
      <div class="stat-card"><div class="num" id="statAIGC">0</div><div class="label">AIGC</div></div>
    </div>

    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-tab" data-filter="video" onclick="setFilter('video')">影像</button>
      <button class="filter-tab" data-filter="graphic" onclick="setFilter('graphic')">平面</button>
      <button class="filter-tab" data-filter="3d" onclick="setFilter('3d')">三维</button>
      <button class="filter-tab" data-filter="aigc" onclick="setFilter('aigc')">AIGC</button>
      <button class="filter-tab" data-filter="featured" onclick="setFilter('featured')">精选</button>
    </div>

    <div id="worksContainer">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal-panel">
    <h2 id="formTitle">添加作品</h2>
    <input type="hidden" id="editId">

    <div class="form-group">
      <label>作品标题</label>
      <input type="text" id="fTitle" placeholder="例：《城市呼吸》">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>分类</label>
        <select id="fCategory">
          <option value="video">影像作品</option>
          <option value="graphic">平面设计</option>
          <option value="3d">三维设计</option>
          <option value="aigc">AIGC</option>
        </select>
      </div>
      <div class="form-group">
        <label>子分类</label>
        <select id="fSubcat"></select>
        <div class="form-hint">切换主分类会自动更新子分类选项</div>
      </div>
    </div>

    <div class="form-group">
      <label>媒体类型</label>
      <select id="fMediaType" onchange="onMediaTypeChange()">
        <option value="bilibili">B站视频</option>
        <option value="image">图片</option>
        <option value="video_file">视频文件链接</option>
      </select>
    </div>

    <div class="form-group" id="mediaUrlGroup">
      <label id="mediaUrlLabel">B站视频链接</label>
      <input type="text" id="fMediaUrl" placeholder="例：https://www.bilibili.com/video/BV1xxxxx" oninput="onMediaUrlInput()">
      <div class="bilibili-preview" id="biliPreview"></div>
      <div class="form-hint" id="mediaHint">粘贴B站视频链接，系统会自动提取视频信息</div>
    </div>

    <div class="form-group">
      <label>缩略图链接</label>
      <input type="text" id="fThumbnail" placeholder="图片URL（B站视频可自动获取）">
      <div class="form-hint">留空则B站视频会自动使用视频封面作为缩略图</div>
    </div>

    <div class="form-group">
      <label>作品描述（可选）</label>
      <textarea id="fDesc" placeholder="简短描述..."></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>排序权重（数字越小越靠前）</label>
        <input type="number" id="fSort" value="0" min="0">
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;">
        <label class="form-check">
          <input type="checkbox" id="fFeatured">
          <span>设为精选作品</span>
        </label>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn" onclick="closeFormModal()">取消</button>
      <button class="btn btn-primary" onclick="saveWork()">保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const SUPABASE_URL = 'https://krakbcpwklvptsfrfpgk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtyYWtiY3B3a2x2cHRzZnJmcGdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTg1NDIsImV4cCI6MjA5ODAzNDU0Mn0.IOjpGOPN_IwiCW2hwRWT8nSivZrz6Ye6RlpQD16NjuU';
const ADMIN_PASSWORD = 'admin123';

const API = `${SUPABASE_URL}/rest/v1`;
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

let allWorks = [];
let currentFilter = 'all';

// ===== AUTH =====
function doLogin() {
  const pwd = document.getElementById('passwordInput').value;
  if (pwd === ADMIN_PASSWORD) {
    sessionStorage.setItem('admin_auth', '1');
    showAdmin();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
function doLogout() {
  sessionStorage.removeItem('admin-auth');
  location.reload();
}
function showAdmin() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('adminApp').style.display = 'block';
  loadWorks();
}
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
if (sessionStorage.getItem('admin-auth') === '1') showAdmin();

// ===== SUPABASE CRUD =====
async function loadWorks() {
  try {
    const res = await fetch(`${API}/works?select=*&order=sort_order.asc,created_at.desc`, { headers: HEADERS });
    allWorks = await res.json();
    renderWorks();
    updateStats();
  } catch (e) {
    showToast('加载失败: ' + e.message);
  }
}

async function saveWork() {
  const id = document.getElementById('editId').value;
  const data = {
    title: document.getElementById('fTitle').value || '未命名作品',
    category: document.getElementById('fCategory').value,
    subcategory: document.getElementById('fSubcat').value,
    media_type: document.getElementById('fMediaType').value,
    media_url: document.getElementById('fMediaUrl').value,
    thumbnail_url: document.getElementById('fThumbnail').value,
    description: document.getElementById('fDesc').value,
    is_featured: document.getElementById('fFeatured').checked,
    sort_order: parseInt(document.getElementById('fSort').value) || 0
  };

  try {
    if (id) {
      await fetch(`${API}/works?id=eq.${id}`, { method: 'PATCH', headers: HEADERS, body: JSON.stringify(data) });
      showToast('作品已更新');
    } else {
      await fetch(`${API}/works`, { method: 'POST', headers: HEADERS, body: JSON.stringify(data) });
      showToast('作品已添加');
    }
    closeFormModal();
    loadWorks();
  } catch (e) {
    showToast('保存失败: ' + e.message);
  }
}

async function deleteWork(id) {
  if (!confirm('确定要删除这个作品吗？')) return;
  try {
    await fetch(`${API}/works?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
    showToast('作品已删除');
    loadWorks();
  } catch (e) {
    showToast('删除失败: ' + e.message);
  }
}

async function toggleFeatured(id, current) {
  try {
    await fetch(`${API}/works?id=eq.${id}`, {
      method: 'PATCH', headers: HEADERS,
      body: JSON.stringify({ is_featured: !current })
    });
    loadWorks();
  } catch (e) {
    showToast('操作失败');
  }
}

// ===== RENDER =====
function renderWorks() {
  const container = document.getElementById('worksContainer');
  let filtered = allWorks;
  if (currentFilter === 'featured') filtered = allWorks.filter(w => w.is_featured);
  else if (currentFilter !== 'all') filtered = allWorks.filter(w => w.category === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📂</div><p>暂无作品，点击右上角「添加作品」开始</p></div>';
    return;
  }

  const catNames = { video: '影像', graphic: '平面', '3d': '三维', aigc: 'AIGC' };
  const typeNames = { bilibili: 'B站', image: '图片', video_file: '视频' };

  container.innerHTML = '<div class="works-list">' + filtered.map(w => {
    const thumb = w.thumbnail_url || (w.media_type === 'bilibili' ? getBiliThumb(w.media_url) : '');
    const thumbHtml = thumb ? `<img class="work-thumb" src="${thumb}" alt="" onerror="this.style.display='none'">` : `<div class="work-thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:0.6rem;">无图</div>`;
    return `
    <div class="work-item">
      ${thumbHtml}
      <div class="work-info">
        <div class="work-title">${esc(w.title)}</div>
        <div class="work-meta">
          <span class="tag">${catNames[w.category] || w.category}</span>
          <span class="tag">${typeNames[w.media_type] || w.media_type}</span>
          ${w.is_featured ? '<span class="tag featured">精选</span>' : ''}
          ${w.subcategory ? `<span>${esc(w.subcategory)}</span>` : ''}
        </div>
      </div>
      <div class="work-controls">
        <button class="btn btn-sm" onclick="toggleFeatured(${w.id}, ${w.is_featured})" title="切换精选">${w.is_featured ? '★' : '☆'}</button>
        <button class="btn btn-sm" onclick="openEditModal(${w.id})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="deleteWork(${w.id})">删除</button>
      </div>
    </div>`;
  }).join('') + '</div>';
}

function updateStats() {
  document.getElementById('statTotal').textContent = allWorks.length;
  document.getElementById('statVideo').textContent = allWorks.filter(w => w.category === 'video').length;
  document.getElementById('statGraphic').textContent = allWorks.filter(w => w.category === 'graphic').length;
  document.getElementById('stat3D').textContent = allWorks.filter(w => w.category === '3d').length;
  document.getElementById('statAIGC').textContent = allWorks.filter(w => w.category === 'aigc').length;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  renderWorks();
}

// ===== FORM MODAL =====
const SUBCAT_OPTIONS = {
  video: [
    { value: 'film', label: '影像剪辑' },
    { value: 'feed', label: '信息流' },
    { value: 'talk', label: '口播' },
    { value: 'commercial', label: '商业宣传' },
    { value: 'drama', label: '短剧带货' }
  ],
  graphic: [
    { value: 'poster', label: '海报' },
    { value: 'brand', label: '品牌' },
    { value: 'layout', label: '排版' },
    { value: 'other', label: '其他' }
  ],
  '3d': [
    { value: 'scene', label: '场景' },
    { value: 'character', label: '角色' },
    { value: 'product', label: '产品' },
    { value: 'other', label: '其他' }
  ],
  photo: [
    { value: 'portrait', label: '人像' },
    { value: 'landscape', label: '风光' },
    { value: 'other', label: '其他' }
  ],
  aigc: [
    { value: 'ai_image', label: 'AI绘图' },
    { value: 'ai_video', label: 'AI视频' }
  ]
};

function updateSubcatOptions(preset) {
  const cat = document.getElementById('fCategory').value;
  const sel = document.getElementById('fSubcat');
  const opts = SUBCAT_OPTIONS[cat] || [{ value: '', label: '默认' }];
  sel.innerHTML = opts.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
  if (preset && opts.some(o => o.value === preset)) {
    sel.value = preset;
  }
}

document.getElementById('fCategory').addEventListener('change', function() { updateSubcatOptions(); });

function openAddModal() {
  document.getElementById('formTitle').textContent = '添加作品';
  document.getElementById('editId').value = '';
  document.getElementById('fTitle').value = '';
  document.getElementById('fCategory').value = 'video';
  updateSubcatOptions();
  document.getElementById('fMediaType').value = 'bilibili';
  document.getElementById('fMediaUrl').value = '';
  document.getElementById('fThumbnail').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fSort').value = '0';
  document.getElementById('fFeatured').checked = false;
  document.getElementById('biliPreview').classList.remove('show');
  onMediaTypeChange();
  document.getElementById('formModal').classList.add('open');
}

function openEditModal(id) {
  const w = allWorks.find(x => x.id === id);
  if (!w) return;
  document.getElementById('formTitle').textContent = '编辑作品';
  document.getElementById('editId').value = w.id;
  document.getElementById('fTitle').value = w.title;
  document.getElementById('fCategory').value = w.category;
  updateSubcatOptions(w.subcategory);
  document.getElementById('fMediaType').value = w.media_type;
  document.getElementById('fMediaUrl').value = w.media_url;
  document.getElementById('fThumbnail').value = w.thumbnail_url;
  document.getElementById('fDesc').value = w.description;
  document.getElementById('fSort').value = w.sort_order;
  document.getElementById('fFeatured').checked = w.is_featured;
  onMediaTypeChange();
  if (w.media_type === 'bilibili') onMediaUrlInput();
  document.getElementById('formModal').classList.add('open');
}

function closeFormModal() {
  document.getElementById('formModal').classList.remove('open');
}

function onMediaTypeChange() {
  const type = document.getElementById('fMediaType').value;
  const label = document.getElementById('mediaUrlLabel');
  const hint = document.getElementById('mediaHint');
  const input = document.getElementById('fMediaUrl');
  if (type === 'bilibili') {
    label.textContent = 'B站视频链接';
    input.placeholder = '例：https://www.bilibili.com/video/BV1xxxxx';
    hint.textContent = '粘贴B站视频链接，系统会自动提取视频信息';
  } else if (type === 'image') {
    label.textContent = '图片链接';
    input.placeholder = '例：https://example.com/image.jpg';
    hint.textContent = '输入图片的完整URL地址';
  } else {
    label.textContent = '视频文件链接';
    input.placeholder = '例：https://example.com/video.mp4';
    hint.textContent = '输入视频文件的完整URL地址';
  }
}

// ===== BILIBILI HELPERS =====
function extractBV(url) {
  const m = url.match(/BV[a-zA-Z0-9]{10}/);
  return m ? m[0] : '';
}
function getBiliThumb(url) {
  const bv = extractBV(url);
  return bv ? `https://i0.hdslb.com/bfs/archive/${bv}.jpg` : '';
}
function getBiliEmbed(url) {
  const bv = extractBV(url);
  return bv ? `//player.bilibili.com/player.html?bvid=${bv}&high_quality=1&danmaku=0` : '';
}

function onMediaUrlInput() {
  const url = document.getElementById('fMediaUrl').value;
  const bv = extractBV(url);
  const preview = document.getElementById('biliPreview');
  if (bv && document.getElementById('fMediaType').value === 'bilibili') {
    preview.innerHTML = `✓ 检测到B站视频: <strong>${bv}</strong><br>缩略图: ${getBiliThumb(url)}`;
    preview.classList.add('show');
    if (!document.getElementById('fThumbnail').value) {
      document.getElementById('fThumbnail').value = getBiliThumb(url);
    }
  } else {
    preview.classList.remove('show');
  }
}

// ===== UTILS =====
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Close modal on overlay click
document.getElementById('formModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeFormModal();
});
</script>
